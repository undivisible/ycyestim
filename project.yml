name: YCYEStim
options:
  bundleIdPrefix: com.ycy
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  indentationWidth: 4
  usesTabs: false
  groupSortPosition: top
  postGenCommand: "ruby scripts/fix_healthkit_capability.rb"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_BITCODE: false
    DEVELOPMENT_TEAM: LZ3NL5434Q
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICON_ASSETS: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  YCYEStim:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: .
        excludes:
          - "Tests/**"
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "docs/**"
          - ".git/**"
          - ".brisk/**"
          - ".build/**"
          - "scripts/**"
          - "*.md"
          - "*.toml"
          - ".brisk.toml"
          - "project.yml"
          - "Package.swift"
          - "Resources/default_presets.json"
          - "YCYEStim.entitlements"
      - path: Resources/default_presets.json
        buildPhase: resources
    dependencies:
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_NAME: "YCYEStim"
        PRODUCT_BUNDLE_IDENTIFIER: dev.undivisible.estim
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: "Info.plist"
        CODE_SIGN_ENTITLEMENTS: "YCYEStim.entitlements"
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        SWIFT_EMIT_LOC_STRINGS: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ENABLE_DEBUG_DYLIB: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
          DEAD_CODE_STRIPPING: true
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
          SWIFT_COMPILATION_MODE: wholemodule
          DEAD_CODE_STRIPPING: true
    preBuildScripts: []
    postCompileScripts: []
    postBuildScripts: []

  YCYEStimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: YCYEStim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.undivisible.estim.tests
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "YCYEStim Tests"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YCYEStim.app/YCYEStim"

schemes:
  YCYEStim:
    build:
      targets:
        YCYEStim: all
        YCYEStimTests: [test]
    run:
      config: Debug
      executable: YCYEStim
    test:
      config: Debug
      targets:
        - YCYEStimTests
    profile:
      config: Release
      executable: YCYEStim
    analyze:
      config: Debug
    archive:
      config: Release
